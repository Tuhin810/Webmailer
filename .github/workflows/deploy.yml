name: Deploy to VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Only one deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_DIR: /home/ubuntu/webmailer
  SERVICE_NAME: webmailer

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Syntax check
        run: |
          node --check server.js
          node --check public/app.js

      - name: Sync files to app directory
        run: |
          mkdir -p "$APP_DIR"
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            ./ "$APP_DIR/"

      - name: Restart service
        run: |
          sudo systemctl restart "$SERVICE_NAME"
          sudo systemctl is-active --quiet "$SERVICE_NAME"
          echo "Deployed $(git rev-parse --short HEAD)"
